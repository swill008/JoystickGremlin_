name: Release EXE installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "latest"

      - name: Install dependencies
        run: poetry install

      - name: Build executable
        run: poetry run pyinstaller -y --clean joystick_gremlin.spec

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\joystick_gremlin\* -DestinationPath dist\Joystick.Gremlin.15.0.2-OSC.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 15.0.2-OSC
          name: Joystick Gremlin 15.0.2-OSC
          body: |
            Portable standalone build 15.0.2-OSC.

            System tray minimize/close, OSC listen stay-on-tab, bulk capture, tray Quit fix.

            Unzip anywhere (Documents, Desktop, etc). Do not put it in Program Files.
            Run joystick_gremlin.exe from the unzipped folder.

            Requires vJoy already installed.
            Unsigned build — SmartScreen may warn on first run.
          files: dist/Joystick.Gremlin.15.0.2-OSC.zip
          token: ${{ secrets.GITHUB_TOKEN }}
