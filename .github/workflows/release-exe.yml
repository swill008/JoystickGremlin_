name: Release EXE installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: R15-OSC-Optimization

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "latest"

      - name: Install dependencies
        run: poetry install

      - name: Build executable
        run: poetry run pyinstaller -y --clean joystick_gremlin.spec

      - name: Stamp date
        run: |
          $CURRENT_DATE = Get-Date -Format yyyy_MM_dd_HHmm
          echo "CURRENT_DATE=$CURRENT_DATE" >> $env:GITHUB_ENV

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\joystick_gremlin\* -DestinationPath dist\Joystick.Gremlin.R15-OSC.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r15-osc-${{ env.CURRENT_DATE }}
          name: Joystick Gremlin R15-OSC ${{ env.CURRENT_DATE }}
          body: |
            fixed live updating of vJoy Mapping

            Portable zip, same style as official Joystick Gremlin R15.
            Unzip anywhere (Documents, Desktop, etc). Do not put it in Program Files.
            Run joystick_gremlin.exe from the unzipped folder.

            Requires vJoy already installed.
            Unsigned build — SmartScreen may warn on first run.
          files: dist/Joystick.Gremlin.R15-OSC.zip
          token: ${{ secrets.GITHUB_TOKEN }}
